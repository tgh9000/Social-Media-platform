<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Verify email</title>
        <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet" type="text/css">

    </head>
        <!-- displays error message and allows user to go back to home page -->
    <body class = "min-h-screen flex items-center justify-center bg-violet-100">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class = "text-2x1 font-bold mb-6 text-center">Error</h2>
            {% if error %}
            <div class="block text-sm font-medium text-gray-700"> {{error}}</div>
            {% endif %}
            <a href="{{url_for('index')}}">
                <button type="submit"  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-950 hover:bg-violet-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 mb-6"> 
                   Go Back Home
                </button>
            </a>
        </div>
    </body>   
</html>
