<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>login Page</title>
        <link href="../static/css/output.css" rel="stylesheet" type="text/css">
        
    </head>
    <body class = "min-h-screen flex items-center justify-center bg-violet-100">
        <!-- box containing login prompt -->
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md"> 
            <h2 class = "text-2x1 font-bold mb-6 text-center">Login</h2>
            <form method="post" action="/login" class="space-y-4">
                <div class="space-y-2">
                    <!-- username input -->
                    <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
                    <input type="text" id="username"
                        name="username" placeholder="Enter your Username or Email" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500">
                </div>
                <div class="space-y-2">
                    <!-- password input -->
                    <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                    <input type="password" id="password"
                        name="password" placeholder="Enter your Password" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500">
                </div>
                <!-- error message if user makes a mistake -->
                {% if error %}
                <div class = " text-red-700 text-sm "> 
                    {{error}}

                </div>
                {% endif %}
                <input type="submit" value="Sign in" class = "w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-950 hover:bg-violet-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">  
            </form>

            <div class="mt-4 text-center text-sm">
                 <!-- button to create a new account -->
                <a href="register.html">
                    <button id = "create account" class="text-violet-500 hover:text-slate-800"> create account</button>
                </a>
                <span>
                    |
                </span>
                <!-- button to reset the password -->
                <a href="forgotPass.html">
                    <button id = "Forgot Password" class="text-violet-500 hover:text-slate-800"> Forgot Password?</button>
                </a>
            </div>
            
        </div>
        

        
    </body>    
</html>
