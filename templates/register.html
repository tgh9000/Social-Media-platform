<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create new account</title>
        <link href="../static/css/output.css" rel="stylesheet" type="text/css">

    </head>
    <body class = "min-h-screen flex items-center justify-center bg-violet-100">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class = "text-2x1 font-bold mb-6 text-center">Create new account</h2>
            <!-- Form to register User -->
            <form method="POST" action="/register" class="space-y-8">
                
                <div class="space-y-2" >
                    <label for= "email" class="block text-sm font-medium text-gray-700"> Email:</label>
                    <input type = "text" id = "email" class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500" placeholder="Please enter your email"
                        name = "email" required>
                </div>
                
                <div class="space-y-2">
                    <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
                    <input type="text" id="username"
                        name="username" placeholder="Enter your Username or Email" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500" required>
                </div>

                <div class="space-y-2">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                    <input type="text" id="password"
                        name="password" placeholder="Please enter your password" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500" required>
                </div>
                <div class="space-y-2">
                    <label for="verPassword" class="block text-sm font-medium text-gray-700">Re-enter Password:</label>
                    <input type="text" id="verPassword"
                        name="verPassword" placeholder="Please Re-enter your password" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500" required>
                </div>
                <!-- Error Message -->
                {% if error %}
                <div class = " text-red-700 text-sm "> 
                    {{error}}

                </div>
                {% endif %}
                <input type="submit" value="Sign up" class = "w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-950 hover:bg-violet-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">  

            </form>
        </div>
        
    </body>
</html>
