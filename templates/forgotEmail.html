<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Verify email</title>
        <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet" type="text/css">

    </head>
    <body class = "min-h-screen flex items-center justify-center bg-violet-100">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class = "text-2x1 font-bold mb-6 text-center">Reset youre Email</h2>
            <div class="block text-sm font-medium text-gray-700"> please enter your email. If an account with that email exists we will send you an email to change your email.</div>
            <!-- Form to reset email -->
            <form method="post" action="/forgotEmail" class="space-y-4">
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
                    <input type="text" id="email"
                        name="email" placeholder="Enter your Email" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500">
                </div>
                <input type="submit" value="send Email reset Request" class = "w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-950 hover:bg-violet-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">  
            </form>

        </div>
    </body>   
</html>
