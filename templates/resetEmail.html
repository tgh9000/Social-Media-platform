<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password</title>
        <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet" type="text/css">
    </head>
    <body class = "min-h-screen flex items-center justify-center bg-violet-100">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md"> 
            <!-- Form to reset an email -->
            <h2 class = "text-2x1 font-bold mb-6 text-center">reset your Email</h2>
            <form method="post" action="/resetEmail" class="space-y-4">
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email:</label>
                    <input type="text" id="email"
                        name="email" placeholder="Enter your Email" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500">
                </div>
                <div class="space-y-2">
                    <label for="reEmail" class="block text-sm font-medium text-gray-700">Re enter Email:</label>
                    <input type="text" id="reEmail"
                        name="reEmail" placeholder="Please re-enter the Email" 
                        class=" w-full px-3 py-2 border border-violet-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500
                        focus:border-indigo-500">
                </div>
                <input type="hidden" name = "id" id = "id" value="{{userId}}">
                <!-- Error Message -->
                {% if error %}
                <div class = " text-red-700 text-sm "> 
                    {{error}}

                </div>
                {% endif %}
                <input type="submit" value="Change Email" class = "w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-950 hover:bg-violet-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">  
            </form>

            
        </div>
        

        
    </body>    
</html>
